<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>2年公共 二学期後半 授業プリント暗記</title>
<style>
:root{
  --bg:#f6f3ec; --sf:#fff; --tx:#232323; --mt:#7c7568; --ln:#e2dccf;
  --ac:#2f5d8a; --ac2:#eaf1f8; --red:#b3261e; --redbg:#ffeceb;
  --ok:#2e7d4f; --okbg:#e8f5ec; --wa:#a4680f; --wabg:#fdf3e3;
  --blue:#1b56b0; --pencil:#4a4a4a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15181b; --sf:#1f2429; --tx:#e9e9e9; --mt:#9aa0a6; --ln:#333a42;
    --ac:#7fb0e0; --ac2:#22303d; --red:#ff8f84; --redbg:#3a2320;
    --ok:#6cc08b; --okbg:#1e3327; --wa:#e2b25a; --wabg:#332b1c;
    --blue:#8fb8ea; --pencil:#c3c3c3;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(8px + env(safe-area-inset-top)) 12px 0;
  border-bottom:1px solid var(--ln);
}
h1{font-size:15px;margin:0 auto 8px;max-width:720px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:6px}
h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
.tabs{display:flex;gap:6px;margin:0 auto 8px;max-width:720px}
.tabs button{
  flex:1;padding:10px 4px;font-size:14px;font-weight:600;border-radius:10px;
  border:1px solid var(--ln);background:var(--sf);color:var(--tx);
}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.units{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;max-width:696px;margin:0 auto}
.units::-webkit-scrollbar{display:none}
.units button{
  flex:none;padding:7px 12px;font-size:13px;border-radius:99px;
  border:1px solid var(--ln);background:var(--sf);color:var(--tx);white-space:nowrap;
}
.units button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:700}
main{padding:12px 12px 0;max-width:720px;margin:0 auto}
.toolbar{display:flex;gap:6px;margin-bottom:12px}
.toolbar button{
  flex:1;padding:10px 4px;font-size:12.5px;font-weight:600;border-radius:10px;
  border:1px solid var(--ln);background:var(--sf);color:var(--tx);
}
.toolbar button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.toolbar button:active{transform:scale(.98)}

.print{margin-bottom:26px}
.print > h2{
  font-size:13px;color:var(--mt);font-weight:700;margin:0 0 10px;
  padding:6px 10px;background:var(--ac2);border-radius:8px;color:var(--ac);
}
.sec{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px 14px 6px;margin-bottom:12px}
.sec h3{
  font-size:15px;margin:2px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ac2);color:var(--ac);
}
.sec h4{font-size:14.5px;margin:14px 0 4px;color:var(--ac);font-weight:700}
p.ln{margin:0 0 10px;line-height:1.9;font-size:15.5px}
p.ln.quote{padding-left:10px;border-left:3px solid var(--ln);color:var(--tx)}
p.ln.small{font-size:13.5px;color:var(--mt);margin-bottom:8px}
p.ln.big{font-size:16px;font-weight:700}
ul.ln{margin:0 0 10px;padding-left:1.2em;font-size:15.5px;line-height:1.9}
ul.ln li{margin-bottom:3px}
hr.sep{border:0;border-top:1px dashed var(--ln);margin:10px 0 12px}

/* 穴埋め */
.bl{
  cursor:pointer;border-radius:4px;padding:0 3px;transition:background .12s;
  border-bottom:1.5px dashed #cbb3b0;background:#fdf7f6;color:var(--mt);
  display:inline;
}
.bl .lb{font-size:.8em;letter-spacing:0}
.bl:not(.o){display:inline-block;min-width:2.6em;text-align:center;padding:1px 8px;margin:0 1px;line-height:1.5}
.note-sep{color:var(--mt);font-size:12px;margin:0 1px}
.bl.o{
  background:var(--redbg);color:var(--red);border-bottom:1.5px solid var(--red);
  font-weight:700;color:var(--red);
}
.bl.o .lb{opacity:.65;margin-right:2px}
.note{font-size:13px;line-height:1.65;border-radius:6px;padding:1px 5px;display:inline;margin-left:4px}
.n-blue{color:var(--blue);background:color-mix(in srgb,var(--blue) 8%,transparent)}
.n-pen{color:var(--pencil);background:color-mix(in srgb,var(--pencil) 8%,transparent);font-style:italic}
.n-red{color:var(--red);background:var(--redbg)}
.note.br{display:block;margin:2px 0 8px}

/* クイズ */
.qbar{margin-bottom:12px}
.qbar .top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mt);margin-bottom:6px}
.pg{height:9px;border-radius:99px;background:var(--ln);overflow:hidden}
.pg i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.chips{display:flex;gap:6px;margin:10px 0 12px}
.chips button{flex:1;padding:8px;font-size:13px;border-radius:9px;border:1px solid var(--ln);background:var(--sf);color:var(--tx)}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.card{
  background:var(--sf);border:1px solid var(--ln);border-radius:18px;
  padding:20px 16px;min-height:230px;display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.04);cursor:pointer;
}
.card .tag{font-size:11.5px;color:var(--mt);margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .tag b{font-weight:700;color:var(--ac)}
.card .q{font-size:16.5px;line-height:1.9;font-weight:600}
.card .q .ctx{font-weight:400;color:var(--mt);font-size:14px}
.card .q .ql{color:var(--red);font-weight:700;border-bottom:2px solid var(--red);padding:0 2px}
.card .a{
  margin-top:16px;padding-top:14px;border-top:1px dashed var(--ln);
  color:var(--red);font-size:16px;line-height:1.85;font-weight:600;
}
.card .hint{font-size:12px;color:var(--mt);margin-top:16px;text-align:center}
.answerBtns{display:flex;gap:8px;margin-top:12px}
.answerBtns button{flex:1;padding:14px 6px;border-radius:12px;font-size:15px;font-weight:700;border:1px solid}
.answerBtns .good{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.answerBtns .bad{background:var(--wabg);color:var(--wa);border-color:var(--wa)}
.navBtns{display:flex;gap:8px;margin-top:10px}
.navBtns button{flex:1;padding:11px;font-size:13.5px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--tx)}
.navBtns button:disabled{opacity:.4}
.done{text-align:center;padding:24px 8px;color:var(--mt);font-size:14.5px;line-height:1.9}
.empty{text-align:center;padding:30px 10px;color:var(--mt);font-size:14px;line-height:1.9}
footer{max-width:720px;margin:0 auto;padding:8px 12px 20px;color:var(--mt);font-size:12px;line-height:1.7;text-align:center}
.reset{background:none;border:0;color:var(--mt);text-decoration:underline;font-size:12px;padding:6px}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#333;color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;opacity:0;
  transition:.25s;pointer-events:none;z-index:50;
}
.toast.show{opacity:.94;transform:translateX(-50%) translateY(0)}
@media(prefers-color-scheme:dark){.toast{background:#e9e9e9;color:#1a1a1a}}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>2年公共 二学期後半 授業プリント暗記</h1>
  <div class="tabs">
    <button id="tabFill" class="on">穴埋め（赤シート）</button>
    <button id="tabQuiz">一問一答クイズ</button>
  </div>
  <div class="units" id="units"></div>
</header>
<main id="main"></main>
<footer>
  授業プリント5枚（①〜⑤）の内容をそのまま収録しています。<br>

  <br><button class="reset" id="resetBtn">学習記録をリセット</button>
</footer>
<div class="toast" id="toast"></div>

/* ============ パース ============ */
const TOK = /\[\[([^\]|]+)\|([^\]]+)\]\]|<<([^|>]+)\|([^>]+)>>/g;
function parts(str){
  const out=[]; let last=0, m; TOK.lastIndex=0;
  while((m=TOK.exec(str))!==null){
    if(m.index>last) out.push({t:"txt", v:str.slice(last,m.index)});
    if(m[1]!==undefined) out.push({t:"bl", label:m[1].trim(), ans:m[2]});
    else out.push({t:"note", color:m[3], v:m[4]});
    last=TOK.lastIndex;
  }
  if(last<str.length) out.push({t:"txt", v:str.slice(last)});
  return out;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* 各プリントをブロックに分解し、空欄一覧も作る */
const DATA = PRINTS.map(p=>{
  const lines = p.body.trim().split("\n").map(s=>s.trim()).filter(s=>s.length);
  const blocks=[]; const blanks=[];
  lines.forEach(line=>{
    if(line.startsWith("## ")){ blocks.push({k:"h4", v:line.slice(3)}); return; }
    if(line.startsWith("# ")){ blocks.push({k:"h3", v:line.slice(2)}); return; }
    if(line.startsWith("> ")){ blocks.push({k:"small", v:line.slice(2)}); return; }
    const ps = parts(line);
    ps.forEach(x=>{ if(x.t==="bl"){ x.id = p.id+"-"+x.label; blanks.push({id:x.id, label:x.label, ans:x.ans, print:p.id, ctx:line}); } });
    blocks.push({k:"p", v:ps, raw:line});
  });
  return {...p, blocks, blanks};
});
const ALL_BLANKS = DATA.flatMap(d=>d.blanks);
const ALL_DESC = DESC.map((d,i)=>({id:"q"+(i+1), print:d[0], q:d[1], ans:d[2]}));

function itemsFor(unit){
  const bs = ALL_BLANKS.filter(b=>unit==="all"||b.print===unit).map(b=>({
    id:b.id, print:b.print, type:"blank", label:b.label, ans:b.ans, ctx:b.ctx
  }));
  const ds = unit==="all" ? ALL_DESC.slice() : ALL_DESC.filter(d=>d.print===unit);
  // 記述を先、穴埋めを後に（全体はプリント順）
  const order = {p1:1,p2:2,p3:3,p4:4,p5:5};
  return ds.concat(bs).sort((a,b)=>order[a.print]-order[b.print]);
}

/* ============ モード1：穴埋め ============ */
function blankHTML(b, openIds){
  const open = openIds.has(b.id);
  return `<span class="bl ${open?"o":""}" data-id="${esc(b.id)}">`+
    `<span class="lb">${esc(b.label)}</span>`+
    (open? esc(b.ans) : "")+
    `</span>`;
}
function noteHTML(color, v){
  const cls = color==="青" ? "n-blue" : color==="赤" ? "n-red" : "n-pen";
  const bits = v.split("／");
  return bits.map(t=>`<span class="note ${cls}">${esc(t)}</span>`).join('<span class="note-sep">／</span>');
}
function lineHTML(ps, openIds){
  return ps.map(x=>{
    if(x.t==="txt") return esc(x.v);
    if(x.t==="bl") return blankHTML(x, openIds);
    return noteHTML(x.color, x.v);
  }).join("");
}
function renderFill(){
  let openIds = new Set();
  const allBlanks = DATA.filter(d=>state.unit==="all"||d.id===state.unit).flatMap(d=>d.blanks);
  const f = state.ffilter;
  if(f==="showall"){ openIds = new Set(allBlanks.map(b=>b.id)); }
  else if(f==="weak"){ openIds = new Set(allBlanks.filter(b=>mark[b.id]!=="weak").map(b=>b.id)); }
  else { openIds = new Set(); }
  const hiddenCount = allBlanks.filter(b=>!openIds.has(b.id)).length;

  let html = `
  <div class="toolbar">
    <button data-f="hideall" class="${state.ffilter==="hideall"?"on":""}">すべて隠す</button>
    <button data-f="showall" class="${state.ffilter==="showall"?"on":""}">すべて表示</button>
    <button data-f="weak" class="${state.ffilter==="weak"?"on":""}">苦手だけ隠す</button>
  </div>
  <p style="font-size:12px;color:var(--mt);margin:-4px 0 12px">
    ${state.unit==="all"?"全5枚":unitLabel(state.unit)}　空欄 ${allBlanks.length}個中 ${hiddenCount}個を非表示　／　タップで答えを表示
  </p>`;

  DATA.filter(d=>state.unit==="all"||d.id===state.unit).forEach(p=>{
    html += `<section class="print"><h2>プリント${p.no}　${esc(p.title)}</h2>`;
    let inSec=false;
    p.blocks.forEach(b=>{
      if(b.k==="h3"){
        if(inSec) html+="</div>";
        html+=`<div class="sec"><h3>${esc(b.v)}</h3>`; inSec=true; return;
      }
      if(!inSec){ html+=`<div class="sec">`; inSec=true; }
      if(b.k==="h4") html+=`<h4>${esc(b.v)}</h4>`;
      else if(b.k==="small") html+=`<p class="ln small">${esc(b.v)}</p>`;
      else html+=`<p class="ln">${lineHTML(b.v, openIds)}</p>`;
    });
    if(inSec) html+="</div>";
    html+=`</section>`;
  });
  main.innerHTML = html;

  main.querySelectorAll(".toolbar button").forEach(b=>{
    b.onclick=()=>{ state.ffilter=b.dataset.f; renderFill(); };
  });
  main.querySelectorAll(".bl").forEach(el=>{
    el.onclick=()=>{
      const id = el.dataset.id;
      const b = ALL_BLANKS.find(x=>x.id===id);
      const nowOpen = !el.classList.contains("o");
      el.classList.toggle("o", nowOpen);
      el.innerHTML = `<span class="lb">${esc(b.label)}</span>` + (nowOpen ? esc(b.ans) : "");
    };
  });
}

/* ============ モード2：クイズ ============ */
function queue(){
  const all = itemsFor(state.unit);
  return state.qfilter==="weak" ? all.filter(i=>mark[i.id]==="weak") : all;
}
function progressFor(unit){
  const all = itemsFor(unit);
  const ok = all.filter(i=>mark[i.id]==="ok").length;
  return {ok, total:all.length, pct: all.length? Math.round(ok/all.length*100):0};
}
function ctxFor(item){
  // 空欄問題の文脈：他の空欄は答えを入れて表示し、対象だけ伏せる
  if(item.type!=="blank") return "";
  const ps = parts(item.ctx);
  let out="", prev="";
  ps.forEach(x=>{
    if(x.t==="txt"){ out+=esc(x.v); if(x.v) prev=x.v.slice(-1); }
    else if(x.t==="note") out+=`<span class="note ${x.color==="青"?"n-blue":x.color==="赤"?"n-red":"n-pen"}">${esc(x.v)}</span>`;
    else if(x.t==="bl"){
      if(x.label.trim()===item.label){
        out += (prev==="（"||prev==="〈") ? `<b class="ql">${esc(item.label)}</b>` : `<b class="ql">（${esc(item.label)}）</b>`;
        prev="）";
      } else { out+=esc(x.ans); prev=x.ans.slice(-1); }
    }
  });
  return out;
}
function renderQuiz(){
  const q = queue();
  const prog = progressFor(state.unit);
  if(state.idx>=q.length) state.idx=0;
  const item = q[state.idx];

  let html = `
  <div class="qbar">
    <div class="top"><span>覚えた ${prog.ok} / ${prog.total} 問</span><span><b style="color:var(--ok)">${prog.pct}%</b></span></div>
    <div class="pg"><i style="width:${prog.pct}%"></i></div>
  </div>
  <div class="chips">
    <button data-flt="all" class="${state.qfilter==="all"?"on":""}">すべて出題</button>
    <button data-flt="weak" class="${state.qfilter==="weak"?"on":""}">苦手だけ復習（${itemsFor(state.unit).filter(i=>mark[i.id]==="weak").length}）</button>
  </div>`;

  if(!item){
    html += `<div class="empty">
      ${state.qfilter==="weak"
        ? "苦手な問題はまだありません。<br>「すべて出題」で進めて、あいまいな問題に「もう一回（苦手）」を押すと、ここに集まります。"
        : "問題がありません。"}
      </div>`;
    main.innerHTML=html;
    bindQuizChips(); return;
  }

  const p = DATA.find(d=>d.id===item.print);
  const isBlank = item.type==="blank";
  const st = mark[item.id];

  html += `
  <div class="card" id="card">
    <div class="tag">
      <b>プリント${p.no}</b><span>${esc(p.title)}</span>
      <span style="margin-left:auto">${isBlank?"穴埋め":"記述"}　${state.idx+1}/${q.length}</span>
      ${st==="weak"?'<span style="color:var(--wa);font-weight:700">苦手</span>':""}
    </div>
    <div class="q">${ isBlank
        ? `<div class="ctx">${ctxFor(item)}</div>`
        : esc(item.q) }</div>
    <div class="a" id="ans" style="display:none">${esc(item.ans)}</div>
    <div class="hint" id="hint">タップして答えを見る</div>
  </div>
  <div class="answerBtns" id="ab" style="display:none">
    <button class="good" data-r="ok">覚えた！</button>
    <button class="bad" data-r="weak">もう一回（苦手）</button>
  </div>
  <div class="navBtns">
    <button id="prev">← 前へ</button>
    <button id="next">次へ →</button>
  </div>`;
  main.innerHTML=html;
  bindQuizChips();

  const card=document.getElementById("card");
  const ans=document.getElementById("ans");
  const hint=document.getElementById("hint");
  const ab=document.getElementById("ab");
  card.onclick=()=>{
    if(ans.style.display==="none"){
      ans.style.display="block"; hint.style.display="none"; ab.style.display="flex";
    }else{
      ans.style.display="none"; ab.style.display="none"; hint.style.display="block";
    }
  };
  ab.querySelectorAll("button").forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      mark[item.id]=b.dataset.r; saveMark();
      toast(b.dataset.r==="ok" ? "覚えた！に登録" : "苦手に登録");
      if(state.qfilter==="weak"){
        // 苦手フィルター中は、リストから外れるので同じ位置の次の問題へ
        const q2=queue();
        if(q2.length===0){ state.idx=0; renderQuiz(); return; }
        if(state.idx>=q2.length) state.idx=0;
        renderQuiz(); return;
      }
      advance(1);
    };
  });
  document.getElementById("prev").onclick=()=>{ state.idx=(state.idx-1+q.length)%q.length; renderQuiz(); };
  document.getElementById("next").onclick=()=>{ advance(1); };
  function advance(n){
    const qq=queue();
    state.idx=(state.idx+n)%qq.length;
    renderQuiz();
  }
}
function bindQuizChips(){
  main.querySelectorAll(".chips button").forEach(b=>{
    b.onclick=()=>{ state.qfilter=b.dataset.flt; state.idx=0; renderQuiz(); };
  });
}

/* ============ 起動 ============ */
function render(){
  tabFill.classList.toggle("on", state.mode==="fill");
  tabQuiz.classList.toggle("on", state.mode==="quiz");
  if(state.mode==="fill") renderFill(); else renderQuiz();
}
tabFill.onclick=()=>{ state.mode="fill"; render(); };
tabQuiz.onclick=()=>{ state.mode="quiz"; state.idx=0; render(); };
renderUnits(); render();

document.getElementById("resetBtn").onclick=()=>{
  if(confirm("学習記録（覚えた・苦手）をすべて消しますか？")){
    mark={}; saveMark(); toast("リセットしました"); render();
  }
};
</script>
</body>
